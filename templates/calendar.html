{% extends "base.html" %} {% block content %} {% if ical_link %}
<h3 class="text-uppercase mb-4">Generated link:</h3>
<p>{{ _('Copy the link below to subscribe to the calendar:')}}</p>
<div class="input-group copy-container">
  <input type="text" class="form-control" id="icalLink" value="{{ical_link }}" readonly />
  <button class="btn btn-primary" onclick="copyToClipboard()">{{ _('Copy')}}</button>
</div>
<p id="copyMessage" class="mt-2 text-success" style="display: none">{{ _('Copied to clipboard!')}}</p>
{% endif %} {% endblock %} {% block script %}
<script>
  // Function to copy text to the clipboard
  function copyToClipboard() {
    var copyText = document.getElementById("icalLink");
    copyText.select();
    copyText.setSelectionRange(0, 99999);

    navigator.clipboard.writeText(copyText.value).then(
      function () {
        document.getElementById("copyMessage").style.display = "block";
        setTimeout(function () {
          document.getElementById("copyMessage").style.display = "none";
        }, 2000);
      },
      function (err) {
        console.error("Could not copy text: ", err);
      }
    );
  }
</script>
{% endblock %}
