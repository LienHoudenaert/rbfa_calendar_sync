{% extends "base.html" %} {% block content %}
<div class="responsive_width">
    {% if ical_link %}
    <h3 class="text-uppercase mb-4">Generated link:</h3>
    <p>{{ _('Copy the link below to subscribe to the calendar:')}}</p>
    <div class="input-group copy-container">
        <input
            type="text"
            class="form-control"
            id="icalLink"
            value="{{ical_link }}"
            readonly
        />
        <button
            type="button"
            class="btn btn-primary"
            onclick="copyToClipboard('icalLink', this)"
            title="{{ _('Copy calendar link') }}"
        >
            <i class="bi bi-clipboard"></i>
        </button>
    </div>
    {% endif %}
</div>
{% endblock %}
