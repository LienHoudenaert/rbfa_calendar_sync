{% extends "base.html" %} {% block content %}
<div class="responsive_width">
    {% if team_results %}
    <h3 class="text-uppercase mb-4">
        {{ _('%(count)s teams found for %(club)s:', count=team_results|length,
        club=club_name) }}
    </h3>
    {% for team in team_results %}
    <form id="select_team" action="/get_team_calendar" method="POST">
        <input type="hidden" name="team_id" value="{{ team.id }}" />
        <input type="hidden" name="team_name" value="{{ team.name }}" />
        <input type="hidden" name="club_name" value="{{ club_name }}" />
        <div class="card mb-3" onclick="this.closest('form').submit()">
            <div class="card-body">{{ team.name }}</div>
        </div>
    </form>
    {% endfor %}
</div>
{% endif %} {% endblock %}
