<!doctype html>
<html lang="{{ get_locale() }}">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>{{ _('RBFA Calendar Sync') }}</title>

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />

        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        />

        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/style.css') }}"
        />
        <link
            rel="icon"
            href="{{ url_for('static', filename='img/favicon.ico') }}"
        />
    </head>

    <body class="d-flex flex-column min-vh-100">
        <!-- Header -->
        <header class="app-header">
            <nav class="navbar navbar-expand-lg">
                <div class="container">
                    <a
                        class="navbar-brand d-flex align-items-center gap-2"
                        href="{{ url_for('main.index') }}"
                    >
                        <img
                            src="/static/img/logo.png"
                            alt="{{ _('Logo') }}"
                            width="50"
                            height="50"
                            class="d-inline-block align-text-center me-2"
                        />
                        <span class="brand-title d-none d-lg-block"
                            >{{ _('RBFA Calendar Sync') }}</span
                        >
                    </a>

                    <div class="d-flex align-items-center gap-2">
                        <a
                            class="btn btn-link nav-calendar-link"
                            href="{{ url_for('calendars.calendars') }}"
                        >
                            <i class="bi bi-bookmark-check-fill me-1"></i>
                            <span class="d-none d-sm-inline"
                                >{{ _('Saved calendars') }}</span
                            >
                        </a>

                        <div class="dropdown">
                            <button
                                class="btn btn-language dropdown-toggle border-0"
                                type="button"
                                id="langSelector"
                                data-bs-toggle="dropdown"
                                aria-expanded="false"
                            >
                                <i class="bi bi-globe2 me-1"></i>
                                {{ get_locale() | upper }}
                            </button>

                            <ul
                                class="dropdown-menu dropdown-menu-end shadow-sm border-0"
                            >
                                <li>
                                    <a
                                        class="dropdown-item"
                                        href="{{ url_for('main.change_language', lang_code='en') }}"
                                    >
                                        EN
                                    </a>
                                </li>

                                <li>
                                    <a
                                        class="dropdown-item"
                                        href="{{ url_for('main.change_language', lang_code='nl') }}"
                                    >
                                        NL
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </nav>
        </header>

        <!-- Main -->
        <main class="flex-grow-1">{% block content %}{% endblock %}</main>

        <!-- Footer -->
        <footer class="app-footer mt-auto">
            <div class="container">
                <div
                    class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-3"
                >
                    <div class="footer-brand">
                        <img
                            src="/static/img/logo.png"
                            alt="{{ _('Logo') }}"
                            width="20"
                            height="20"
                            class="d-inline-block align-text-center me-2"
                        />
                        <span>{{ _('RBFA Calendar Sync') }}</span>
                    </div>

                    <div class="footer-links">
                        <a href="{{ url_for('main.index') }}"
                            >{{ _('Home') }}</a
                        >
                        <a href="{{ url_for('calendars.calendars') }}"
                            >{{ _('Saved calendars') }}</a
                        >
                    </div>
                </div>
            </div>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

        <script src="{{ url_for('static', filename='js/clipboard.js') }}"></script>

        {% block script %}{% endblock %}
    </body>
</html>
